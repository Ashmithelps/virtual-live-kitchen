# Production profile (SPRING_PROFILES_ACTIVE=prod). Everything secret still comes from environment variables;
# ProductionGuard refuses to start with development settings.
server:
  # Caddy terminates TLS; trust its X-Forwarded-For/-Proto (Tomcat only honours them from private-network peers).
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    remoteip:
      # Docker bridge networks are private (172.16/12), which Tomcat trusts by default; stated here for clarity.
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    # Migrations run on every startup; a failed migration stops the app (and the deploy health check rolls back).
    validate-on-migrate: true
    out-of-order: false

logging:
  structured:
    # One JSON object per line (Elastic Common Schema) for `docker logs`/log shippers.
    format:
      console: ecs
    ecs:
      service:
        name: virtual-kitchen-backend
        environment: ${SENTRY_ENVIRONMENT:production}
        version: ${APP_VERSION:unknown}
  level:
    root: INFO

management:
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  storage:
    # R2/S3 buckets and their CORS are created by hand (PRODUCTION.md); API tokens can't create buckets.
    create-buckets: ${S3_CREATE_BUCKETS:false}
