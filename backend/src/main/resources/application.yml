spring:
  application:
    name: virtual-kitchen-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        # Seconds. Without a socket timeout a stalled database (network blip, failover) hangs request threads
        # forever; with it they fail, return 500 and are reported. Longest legitimate query is far below this.
        connectTimeout: 10
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:30}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    # Disable Spring's default /error endpoint JSON — GlobalExceptionHandler handles everything
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    # 3.0 keeps `nullable: true`, which openapi-typescript turns into `T | null`.
    version: openapi_3_0
    # Set API_DOCS_ENABLED=false to hide /v3/api-docs and Swagger UI (e.g. in production).
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Component details (database, disk) only for signed-in callers in production (application-prod.yml).
      show-details: ${HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true

# Error reporting. Disabled while SENTRY_DSN is empty. ERROR log lines and unhandled exceptions become Sentry events;
# no request bodies, cookies or user identities are sent.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${APP_VERSION:dev}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    # HMAC-SHA256 key; must be at least 32 bytes. No default on purpose.
    secret: ${JWT_SECRET}
    issuer: virtual-kitchen
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

  rate-limit:
    # Per-client-IP limits on public endpoints (in memory, single node). Signed-in API calls and webhooks aren't
    # limited here; login also has a per-phone limit (below).
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Shared with the web app's server (Vercel), which sends the visitor's IP in X-Client-IP with this secret.
    trusted-proxy-secret: ${BACKEND_PROXY_SECRET:}
    max-tracked-clients: 100000
    rules:
      - name: auth
        methods: [POST]
        paths: [/api/auth/login, /api/auth/register, /api/auth/refresh, /api/station-device/pair]
        capacity: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
        period: 1m
      - name: public-write
        methods: [POST, PUT, PATCH, DELETE]
        paths: [/api/guest/**, /api/public/**]
        capacity: ${RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE:60}
        period: 1m
      - name: public-read
        methods: [GET]
        paths: [/api/restaurants, /api/restaurants/**, /api/tables/*, /api/guest/**, /api/public/**, /api/time]
        capacity: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:300}
        period: 1m

  auth:
    login-rate-limit:
      # Each phone gets `capacity` login attempts; the bucket refills fully over `refill-period`.
      capacity: ${LOGIN_RATE_LIMIT_CAPACITY:5}
      refill-period: ${LOGIN_RATE_LIMIT_REFILL_PERIOD:15m}

  web:
    # Customer-facing site; table QR codes encode <base-url>/t/<qr token>.
    base-url: ${WEB_BASE_URL:http://localhost:3000}

  table-session:
    # How long a QR scan lets a customer keep ordering for that table.
    ttl: ${TABLE_SESSION_TTL:4h}

  guest-order:
    # Lifetime of the order-scoped token returned by guest checkout.
    token-ttl: ${GUEST_ORDER_TOKEN_TTL:12h}

  restaurant:
    # Opening hours are wall-clock times in this zone ("open now" is evaluated here).
    timezone: Asia/Kolkata

  order:
    # GST on restaurant food: 5% = 500 basis points.
    tax-rate-basis-points: ${ORDER_TAX_RATE_BPS:500}
    max-lines: 50
    max-quantity-per-line: 50

  payment:
    # "razorpay" (real gateway; use rzp_test_ keys in development) or "mock" (approves everything,
    # never use in production).
    provider: ${PAYMENT_PROVIDER:mock}
    # Shown in the checkout dialog.
    merchant-name: ${PAYMENT_MERCHANT_NAME:Virtual Live Kitchen}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # Set in Razorpay Dashboard → Settings → Webhooks; used to verify X-Razorpay-Signature.
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
      # Route linked accounts for chefs' tips (business profile Razorpay requires).
      route:
        business-category: ${RAZORPAY_ROUTE_CATEGORY:food}
        business-subcategory: ${RAZORPAY_ROUTE_SUBCATEGORY:restaurant}

  billing:
    # Defaults; admins can change trial and grace days at runtime (Admin → Billing).
    default-trial-days: ${BILLING_TRIAL_DAYS:30}
    default-grace-days: ${BILLING_GRACE_DAYS:7}
    gst-rate-bps: ${BILLING_GST_RATE_BPS:1800}
    # SAC for software/SaaS services; confirm with your accountant.
    sac-code: ${BILLING_SAC_CODE:998315}
    invoice-prefix: ${BILLING_INVOICE_PREFIX:VLK}
    # Supplier (the platform) on GST invoices.
    supplier-legal-name: ${BILLING_SUPPLIER_LEGAL_NAME:Virtual Live Kitchen Pvt Ltd}
    supplier-gstin: ${BILLING_SUPPLIER_GSTIN:}
    supplier-address: ${BILLING_SUPPLIER_ADDRESS:Bengaluru, Karnataka}
    supplier-state-code: ${BILLING_SUPPLIER_STATE_CODE:29}

  hygiene:
    # AI hygiene scoring of READY clips. Off unless the AI service is running (see ai-service/README.md).
    enabled: ${HYGIENE_ENABLED:false}
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:}
    request-timeout: ${AI_SERVICE_TIMEOUT:5m}
    # Storage endpoint as the AI service sees it (e.g. http://minio:9000 inside docker-compose); empty = S3_ENDPOINT.
    video-s3-endpoint: ${AI_VIDEO_S3_ENDPOINT:}
    # Rolling window and the minimum number of scored clips before a score may be shown publicly.
    window: ${HYGIENE_WINDOW:30d}
    min-public-clips: ${HYGIENE_MIN_PUBLIC_CLIPS:20}

  tips:
    # Platform's share of each tip in basis points (0 = the chef gets 100%). Gateway fees are the platform's cost.
    platform-fee-bps: ${TIP_PLATFORM_FEE_BPS:0}
    min-paise: ${TIP_MIN_PAISE:1000}
    max-paise: ${TIP_MAX_PAISE:500000}
    presets-paise: 2000,5000,10000

  clips:
    # Footage window around an order: PREPARING minus lead .. READY plus tail.
    window-lead: 10s
    window-tail: 5s
    # Station phones keep 45 min of footage; a request not fulfilled in this time won't be.
    upload-timeout: ${CLIP_UPLOAD_TIMEOUT:2h}
    # Max size of one uploaded chunk (a 60 s chunk at ~1.2 Mbit/s is ~9 MB).
    max-chunk-bytes: 52428800
    pairing-code-ttl: 10m
    # Processed clips are deleted after this long (configurable per deployment).
    retention: ${CLIP_RETENTION:30d}
    # Raw footage is deleted after a successful render, or after this long at the latest.
    raw-retention: ${CLIP_RAW_RETENTION:24h}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    # Kills a stuck FFmpeg run; the job is then retried.
    ffmpeg-timeout: ${FFMPEG_TIMEOUT:10m}
    # Watermark text in the corner of every clip.
    watermark: ${CLIP_WATERMARK:Virtual Live Kitchen}
    # Presigned watch/download links for clips expire after this.
    watch-url-ttl: ${CLIP_WATCH_URL_TTL:10m}

  jobs:
    # Background worker threads in this instance. 0 = don't process jobs here (e.g. API-only nodes
    # once a dedicated worker instance exists). Each clip job runs FFmpeg, so keep this near CPU count.
    worker-threads: ${JOB_WORKER_THREADS:1}
    poll-interval: ${JOB_POLL_INTERVAL:2s}
    # A RUNNING job not finished within this time is assumed dead (crashed worker) and re-queued.
    lease: ${JOB_LEASE:20m}
    max-attempts: ${JOB_MAX_ATTEMPTS:5}
    # Retry delay: base × 2^(attempt−1).
    retry-base-delay: ${JOB_RETRY_BASE_DELAY:30s}
    # Extra worker lanes (threads each). "hygiene" = AI analysis, kept apart so it never delays clip rendering.
    lanes:
      hygiene: ${JOB_HYGIENE_THREADS:1}

  chef-consent:
    # Text lives in src/main/resources/consent/recording-consent-<version>.txt.
    # Bumping this forces every chef to re-accept before they can be assigned or recorded.
    current-version: v1

  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:ap-south-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    media-bucket: ${S3_BUCKET_MEDIA:media}
    # Private bucket for kitchen footage (raw/{restaurantId}/{orderId}/… uploaded by station devices).
    clips-bucket: ${S3_BUCKET_CLIPS:clips}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${S3_DOWNLOAD_URL_TTL:1h}
    # Create the media bucket on startup if it does not exist (handy locally).
    create-buckets: ${S3_CREATE_BUCKETS:true}

  # Seeded once on startup if no user with this phone exists. Leave blank to skip seeding.
  admin:
    name: ${ADMIN_NAME:Platform Admin}
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
