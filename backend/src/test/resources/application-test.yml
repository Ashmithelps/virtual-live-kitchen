# Test-only values; never used outside the test classpath.
app:
  rate-limit:
    # RateLimitIT turns this on for its own context.
    enabled: false
  jwt:
    secret: test-only-jwt-secret-that-is-at-least-32-bytes-long
  auth:
    login-rate-limit:
      capacity: 5
      refill-period: 15m
  storage:
    # endpoint/keys come from the MinIO Testcontainer (IntegrationTest)
    media-bucket: media-test
    clips-bucket: clips-test
    create-buckets: true
  jobs:
    # No background workers in tests; ClipPipelineIT drives JobWorker.runOnce by hand.
    worker-threads: 0
    lanes:
      hygiene: 0
  admin:
    name: Test Admin
    phone: "+910000000001"
    password: test-admin-password
