# main → tests → images (GHCR) → backend on the VM over SSH → web on Vercel.
# Setup (secrets, the "production" environment, the server) is in PRODUCTION.md → "CI/CD". The two deploy jobs run
# only when the repository variable DEPLOY_ENABLED is "true"; until then main builds and pushes images only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            target: ""
          - name: ai
            context: ai-service
            target: runtime
          - name: backup
            context: infra/backup
            target: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Registry path (GHCR needs lowercase)
        id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.reg.outputs.registry }}/vlk-${{ matrix.name }}:${{ github.sha }}
            ${{ steps.reg.outputs.registry }}/vlk-${{ matrix.name }}:main
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  backend:
    name: Deploy backend (VM)
    needs: images
    # Off until the server and secrets exist (PRODUCTION.md §9): set the repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}/actuator/health
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Copy compose file, Caddyfile and deploy script
        run: scp infra/docker-compose.prod.yml infra/caddy/Caddyfile infra/deploy/deploy.sh vm:/opt/vlk/
      - name: Pull and restart (rolls back automatically if unhealthy)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token can pull this repository's images and expires when the job ends.
          printf '%s' "$GHCR_TOKEN" | ssh vm "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" > /dev/null
          status=0
          ssh vm "/opt/vlk/deploy.sh '${{ github.sha }}'" || status=$?
          ssh vm "docker logout ghcr.io" > /dev/null || true
          exit $status
      - name: Public health check through Caddy
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "https://${{ vars.API_DOMAIN }}/actuator/health" | grep -q '"status":"UP"' && exit 0
            sleep 5
          done
          echo "::error::https://${{ vars.API_DOMAIN }}/actuator/health is not UP"; exit 1

  web:
    name: Deploy web (Vercel)
    needs: backend
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      # Run from the repository root: the Vercel project's Root Directory is "web".
      - run: npx --yes vercel@61.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@61.1.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@61.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
