services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: rustfs/rustfs:latest
    container_name: virtual-kitchen-storage
    restart: unless-stopped
    env_file: .env
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/data

  # Hygiene analysis (FastAPI + YOLO). Optional and heavy (~2 GB image): start with
  #   docker compose --profile ai up -d --build ai-service
  # Needs model weights in ai-service/models (see ai-service/README.md); without them it answers 503.
  # The backend reaches it at http://localhost:8000 and must presign clip URLs for http://minio:9000
  # (AI_VIDEO_S3_ENDPOINT), the storage address as seen from inside this network.
  ai-service:
    profiles: ["ai"]
    build:
      context: ../ai-service
      target: runtime
    restart: unless-stopped
    env_file:
      - path: ../ai-service/.env
        required: false
    environment:
      ALLOWED_VIDEO_HOSTS: ${ALLOWED_VIDEO_HOSTS:-minio:9000}
    ports:
      - "8000:8000"
    volumes:
      - ../ai-service/models:/app/models:ro
    depends_on:
      - minio
